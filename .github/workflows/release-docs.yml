name: Release documents

# Builds the generated documents that used to be committed -- the technical
# implementation PDF and the manager briefing deck (.pptx and .pdf) -- and
# attaches them to the GitHub release. Run it by hand to get them as a workflow
# artifact without a release.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # to attach files to the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install LibreOffice Impress
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-impress

      - name: Build the technical implementation PDF
        run: CHROME=google-chrome npm run docs:pdf

      - name: Build the manager briefing deck
        run: npm run docs:deck

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kakashi-documents
          path: |
            docs/TECHNICAL_IMPLEMENTATION.pdf
            presentation/Kakashi_Manager_Briefing.pptx
            presentation/Kakashi_Manager_Briefing.pdf

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" --clobber \
            docs/TECHNICAL_IMPLEMENTATION.pdf \
            presentation/Kakashi_Manager_Briefing.pptx \
            presentation/Kakashi_Manager_Briefing.pdf
