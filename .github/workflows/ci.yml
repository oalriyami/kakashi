name: CI

# Runs the full test suite on every push and PR across the three Node major
# versions Kakashi supports. Kept intentionally boring: no linting, no coverage
# upload, no matrix expansion — just: does it install, does it test green. The
# suite runs offline in a few seconds, so we don't need any caching cleverness.
#
# Database tests run against a real Postgres service container and a real
# on-disk SQLite file. Everything else stays offline.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']

    # A real Postgres, so the `pg` adapter is exercised against a server rather
    # than against a mock. The driver tests skip themselves (and say so) when
    # KAKASHI_TEST_POSTGRES_URL is absent, so this is the difference between the
    # adapter being covered and being merely present.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kakashi
          POSTGRES_PASSWORD: kakashi
          POSTGRES_DB: kakashi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kakashi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      KAKASHI_TEST_POSTGRES_URL: postgres://kakashi:kakashi@127.0.0.1:5432/kakashi_test

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      # `npm ci`: the lockfile is installed exactly. It could not be while
      # snowflake-sdk was an optionalDependency (its transitive gcp-metadata
      # left the lockfile out of sync); the database drivers are now optional
      # peers (#46). The two drivers the suite runs against, pg and
      # better-sqlite3, are devDependencies, so a driver that fails to install
      # fails the build instead of quietly turning its tests into skips.
      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npm test

      # A quick post-test sanity check that the CLI actually invokes.
      # Catches missing shebangs, broken bins, and packaging regressions.
      - name: Smoke test — kakashi --version
        run: node bin/kakashi.js --version

      - name: Smoke test — kakashi list-patterns
        run: node bin/kakashi.js list-patterns | head -30

  # The one-line installers, run the way the README runs them: piped. A piped
  # bash script has no BASH_SOURCE and `irm | iex` has no script path, and both
  # of those used to break the install with nothing in CI to notice (#45).
  # The package under test is packed and installed through KAKASHI_PACKAGE.
  installers:
    name: installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pack the package under test
        shell: bash
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          echo "KAKASHI_PACKAGE=$(ls "$RUNNER_TEMP"/*.tgz)" >> "$GITHUB_ENV"

      - name: install.sh, piped to bash
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          # A mistyped option stops the script before anything happens.
          if cat install.sh | bash -s -- --dryrun; then echo "--dryrun was accepted"; exit 1; fi
          # --dry-run installs nothing and writes nothing.
          cat install.sh | bash -s -- --dry-run --all
          test ! -e "$HOME/.claude"
          ! npm ls -g @muhammadatef/kakashi
          # The real thing.
          cat install.sh | bash -s -- --all
          test "$(ls "$HOME/.claude/commands" | wc -l)" -eq 14
          test "$(ls "$HOME/.cursor/commands" | wc -l)" -eq 14
          # Uninstalling one agent leaves the others alone.
          cat install.sh | bash -s -- --uninstall --only cursor
          test "$(ls "$HOME/.cursor/commands" | wc -l)" -eq 0
          test "$(ls "$HOME/.claude/commands" | wc -l)" -eq 14
          kakashi uninstall
          test ! -e "$HOME/.claude/commands/kakashi.md"

      - name: install.ps1, piped to Invoke-Expression (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Get-Content install.ps1 -Raw
          # A mistyped option stops the script before anything happens.
          & ([scriptblock]::Create($script)) --dryrun
          if ($LASTEXITCODE -ne 2) { throw "--dryrun: exit $LASTEXITCODE" }
          # Plain `irm | iex`: no options, no script path.
          $script | Invoke-Expression
          if ($LASTEXITCODE -ne 0) { throw "iex: exit $LASTEXITCODE" }
          & ([scriptblock]::Create($script)) --all
          if ($LASTEXITCODE -ne 0) { throw "--all: exit $LASTEXITCODE" }
          $n = (Get-ChildItem "$env:USERPROFILE\.claude\commands").Count
          if ($n -ne 14) { throw "expected 14 Claude commands, found $n" }
          & ([scriptblock]::Create($script)) --uninstall --only cursor
          if ((Get-ChildItem "$env:USERPROFILE\.claude\commands").Count -ne 14) { throw 'uninstalling cursor touched Claude' }
          kakashi uninstall
          if (Test-Path "$env:USERPROFILE\.claude\commands\kakashi.md") { throw 'uninstall left Claude commands' }

      - name: install.ps1 --dry-run (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ([scriptblock]::Create((Get-Content install.ps1 -Raw))) --dry-run --all
          if ($LASTEXITCODE -ne 0) { throw "--dry-run: exit $LASTEXITCODE" }
